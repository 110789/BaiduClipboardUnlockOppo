plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.baiduclipboardunlock'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.baiduclipboardunlock"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
